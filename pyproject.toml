[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyclon"
version = "2.0.0-rc"
description = "Orchestrate AI agents to execute complex coding workflows with a terminal UI - define your plan, let AI handle the rest."
readme = "README.md"
requires-python = ">=3.9"
authors = [{name = "Mariusz Andrzejewski (Sayco)", email = "sayco@saycode.pl"}]
license = {text = "MIT"}
dependencies = [
  "linkify-it-py==2.0.3",
  "markdown-it-py==4.0.0",
  "mdit-py-plugins==0.5.0",
  "mdurl==0.1.2",
  "platformdirs==4.5.1",
  "psutil==7.2.2",
  "pyte==0.8.2",
  "Pygments==2.19.2",
  "ptyprocess==0.7.0",
  "rich==14.3.1",
  "textual==7.4.0",
  "textual-autocomplete==4.0.6",
  "typing_extensions==4.15.0",
  "uc-micro-py==1.0.3",
]

[project.scripts]
cyclon = "cyclon.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=4.1.0",
  "ruff>=0.1.0",
  "black>=23.0.0",
  "mypy>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--cov=cyclon --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["cyclon"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
fail_under = 45
skip_covered = false
show_missing = true

[tool.setuptools]
packages = ["cyclon", "cyclon.services"]

[tool.setuptools.package-data]
cyclon = ["data/**/*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
  | venv
  | __pycache__
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "D",   # pydocstyle
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PL",  # Pylint
]
ignore = [
    "D100",  # Missing docstring in public module
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
    "PLR2004", # Magic value used in comparison
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
python_version = "3.9"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
show_column_numbers = true
exclude = [
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "tests",
]
